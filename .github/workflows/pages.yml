# Runs the engine tests on every push. The site itself is published by GitHub Pages from the branch
# (Cloudflare Pages builds the branch), so the app is at https://noticedecoder.pages.dev/app/
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine.test.mjs
      - run: node tests/fuzz.test.mjs
      - run: node tests/files.test.mjs
      - run: npm ci --prefix worker --no-audit --no-fund
      - run: node worker/test/feed.test.mjs && node worker/test/room.test.mjs && node worker/test/push.test.mjs && node worker/test/ai.test.mjs
      - run: node tools/bundle-engine.mjs && node integrations/gmail-apps-script/test/run.mjs
      - run: node companion/scripts/sync-engine.mjs && node companion/test/pipeline.test.mjs
      - run: node tools/sync-extension.mjs
      - name: bundle, companion and extension engine copies are up to date
        run: |
          git diff --exit-code -- dist/notice-engine.js companion/engine/notice-engine.js extension/engine.js || (echo 'run: node tools/bundle-engine.mjs && node companion/scripts/sync-engine.mjs && node tools/sync-extension.mjs, then commit' && exit 1)
