# Runs the engine tests on every push. The site itself is published by GitHub Pages from the branch
# (Settings > Pages > Deploy from a branch), so the app is at https://anki1kr.me/NoticeDecoder/app/
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine.test.mjs
